[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hippocampus-context"
version = "0.1.0"
description = "A local, single-session context assembler for Ollama chats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.9,<15",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]

[project.scripts]
hippocampus = "hippocampus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a running local Ollama service and qwen3.5:9b",
]
