<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hippocampus</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">H</span>
          <div>
            <strong id="brand-name">LLM</strong>
            <small>local memory · raw truth</small>
          </div>
        </div>
        <div class="chips" aria-label="会话状态">
          <span class="chip" id="model-chip">model</span>
          <button class="chip button-chip" id="think-button" type="button">think:on</button>
          <span class="chip" id="context-chip">ctx:—</span>
          <span class="chip status-chip" id="session-status">active</span>
        </div>
      </header>

      <main id="conversation" class="conversation" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark">◇</div>
          <h1 id="empty-name">LLM</h1>
          <p>原始对话是记忆本体。Markdown 回复会在这里渲染为富文本。</p>
        </div>
      </main>

      <footer class="composer-wrap">
        <div class="runtime-status">
          <span class="pulse" id="pulse"></span>
          <span id="runtime-message">正在连接…</span>
          <span class="token-status" id="token-status"></span>
        </div>
        <form id="composer" class="composer">
          <textarea id="message" rows="1" maxlength="1048576" placeholder="Ask anything…" aria-label="消息"></textarea>
          <div class="composer-actions">
            <button class="ghost-button" id="save-button" type="button">Save</button>
            <button class="ghost-button danger hidden" id="cancel-button" type="button">Stop</button>
            <button class="send-button" id="send-button" type="submit" aria-label="发送">↑</button>
          </div>
        </form>
        <div class="footer-line">
          <span id="session-label">session —</span>
          <span>Enter 发送 · Shift+Enter 换行</span>
        </div>
      </footer>
    </div>

    <dialog id="limit-dialog" class="limit-dialog">
      <form method="dialog">
        <div class="warning-mark">!</div>
        <h2>上下文接近上限</h2>
        <p id="limit-message">继续会丢弃最旧的完整轮次，原始会话记录仍会保留。</p>
        <div class="dialog-actions">
          <button value="end" class="ghost-button">暂停会话</button>
          <button value="continue" class="primary-button">裁剪并继续</button>
        </div>
      </form>
    </dialog>

    <template id="message-template">
      <article class="message-row">
        <div class="role-icon"></div>
        <div class="message-body">
          <div class="role-label"></div>
          <details class="thinking hidden">
            <summary>Thinking</summary>
            <pre></pre>
          </details>
          <div class="markdown"></div>
          <div class="provenance hidden"></div>
          <div class="message-meta"></div>
        </div>
      </article>
    </template>
    <script src="/app.js" defer></script>
  </body>
</html>
